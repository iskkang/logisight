name: Monthly Report Publish

# 자동발행: monthly-analysis(매월 2일)가 만든 초안을 매월 5일 발행.
# 5일까지 3일간이 검수 창 — 필요 시 초안을 미리 수정. 수동 트리거도 유지.
# 실행 → PDF 생성 + Storage 업로드 + reports upsert + published PDF 커밋.
on:
  schedule:
    - cron: '0 19 5 * *'   # 매월 5일 04:00 KST — 초안(2일 생성) 검수 후 자동 발행
  workflow_dispatch:
    inputs:
      month:
        description: '대상 월 (YYYY-MM, 라벨/발행 월). 비우면 현재 월(UTC)'
        required: false

concurrency:
  group: monthly-report-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: 대상 월 결정
        id: m
        env:
          MONTH: ${{ github.event.inputs.month }}
        run: |
          MONTH="${MONTH:-$(date -u +%Y-%m)}"   # 라벨/발행 월 = 현재 월 (초안 section:all과 동일)
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "대상 월: $MONTH"

      - name: Chrome 경로 확인
        id: chrome
        run: |
          BIN=$(which google-chrome || which google-chrome-stable || which chromium-browser || true)
          [ -z "$BIN" ] && { echo "::error::Chrome 미설치 — 러너에서 google-chrome 을 찾지 못함"; exit 1; }
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Chrome: $BIN"

      # ── 검증을 발행 앞에 둔다 ────────────────────────────────────────
      #
      # 예전에는 [PDF 생성 → 발행 → 커밋 → QA] 순서였다. QA 가 critical 을 찾아도
      # 이미 나간 뒤라, 워크플로 자신이 「QA Critical 결함 … 발행 자체는 유지됨」
      # 이라고 찍었다. 실제로 2026-08호의 qa-report.md 가 「❌ 발행 보류 — critical
      # 발견(창작 수치 2건)」인데 PDF 는 발행 상태로 남아 있었다.
      #
      # 검증은 내보내기 전에 하는 것이다. 나간 뒤에 하는 것은 검증이 아니라 기록이다.
      # verify-report.js 는 원래부터 critical 이 있으면 exit 1 한다 —— 스크립트는
      # 옳았고 부르는 순서가 틀려 있었다.

      - name: 초안 존재 확인
        # 초안이 없으면 QA 가 "읽을 파일이 없다"로 실패하고, 그게 「QA 결함」처럼
        # 보인다. 2026-08-06 실행이 정확히 그랬다. 원인을 여기서 먼저 가른다.
        env:
          MONTH: ${{ steps.m.outputs.month }}
        run: |
          DRAFT="content/drafts/monthly-analysis-${MONTH}.md"
          [ -f "$DRAFT" ] || {
            echo "::error::초안이 없다: $DRAFT — monthly-analysis(매월 2일)가 돌았는지 확인할 것. QA 결함이 아니다."
            exit 1
          }
          echo "초안 확인: $DRAFT"

      - name: 검증 (기계 린트 + Claude 교차모델) — critical 이면 여기서 멈춘다
        id: qa
        env:
          MONTH: ${{ steps.m.outputs.month }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generators/report/verify-report.js --month="$MONTH"

      - name: qa-report 업로드
        # 실패했을 때야말로 봐야 하는 파일이다. always() 로 둔다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ steps.m.outputs.month }}
          path: content/monthly-report/${{ steps.m.outputs.month }}/qa-report.md
          if-no-files-found: warn

      - name: qa-report 커밋
        if: always()
        env:
          MONTH: ${{ steps.m.outputs.month }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/monthly-report/*/qa-report.md || true
          if git commit -m "chore(monthly): QA report $MONTH"; then
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              echo "qa push attempt $i failed — retrying"; sleep 5
            done
          else
            echo "no qa changes"
          fi

      # 아래 두 스텝은 검증을 통과했을 때만 도달한다.
      # QA 가 exit 1 하면 GitHub Actions 가 여기서 잡을 멈추므로, 조건을 따로 적지 않는다.
      - name: PDF 생성 + 발행
        id: pub
        env:
          MONTH: ${{ steps.m.outputs.month }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          npm run monthly:pdf -- --month="$MONTH"
          npm run monthly:publish -- --month="$MONTH"

      - name: published PDF 커밋
        env:
          MONTH: ${{ steps.m.outputs.month }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/published/monthly-analysis-*.pdf
          git commit -m "chore(monthly): publish PDF $MONTH" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          echo "::error::publish PDF push failed after 3 attempts"; exit 1

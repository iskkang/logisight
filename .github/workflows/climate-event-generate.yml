name: Climate Event — Logistics Impact Draft

# event-ingest(:15)·impact-judge(:25)가 매 2h 도므로, 그 이후 :45에 매 2h 돌려 최신 데이터를 읽는다.
# 신규 이벤트만 narrate(dedup) → 더 자주 돌아도 비용은 신규 연관 이벤트 수에 비례, 알림 응답성 향상.
on:
  schedule:
    - cron: '45 */2 * * *'   # 매 2h(:45), event-ingest·impact-judge 직후
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate climate-event logistics impact drafts
        run: npm run generate:climate-event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: Fetch Index1520 Data

on:
  schedule:
    - cron: "31 0 1,6,11,16,21,26 * *" # 09:31 KST on 1,6,11,16,21,26
  workflow_dispatch:

jobs:
  fetch-index1520:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch and save Index1520 data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-index1520.mjs

name: Weekly Region Reports

# 매주 일요일: 권역별 심층 분석형 위클리 리포트 자동 생성 + 발행.
#   deep-feed(핵심 이슈 클러스터링 + 심층 분석 + 운임 지표) → 권역 PDF(차트 포함) 렌더 → reports 버킷/카탈로그 발행.
# 데이터원: maritime_news(주간 누적, 일간 수집/큐레이션 결과). 0건 권역은 자동 생략.
# 필요 secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DEEPSEEK_API_KEY, UNSPLASH_ACCESS_KEY
on:
  schedule:
    - cron: '30 6 * * 0'   # 일요일 15:30 KST (06:30 UTC) — 글로벌 weekly-report(14:00 KST) 이후
  workflow_dispatch:
    inputs:
      week:
        description: '주차 (YYYY-Www). 비우면 현재 ISO 주차'
        required: false
      publish:
        description: '발행(reports 버킷 업로드). false면 생성만'
        type: boolean
        default: true

concurrency:
  group: weekly-region-reports
  cancel-in-progress: false

jobs:
  region-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Chrome 경로 확인 (PDF 렌더용)
        id: chrome
        run: |
          BIN=$(which google-chrome || which google-chrome-stable || which chromium-browser || true)
          [ -z "$BIN" ] && { echo "::error::Chrome 미설치 — 러너에서 google-chrome 을 찾지 못함"; exit 1; }
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Chrome: $BIN"

      - name: 주차 산출
        id: w
        run: |
          WEEK="${{ github.event.inputs.week }}"
          [ -z "$WEEK" ] && WEEK=$(date -u +%G-W%V)
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "주차: $WEEK"

      - name: 권역 심층 분석 리포트 생성 (deep feed + PDF, 데이터 있는 권역만)
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          for r in europe americas russia latam china japan sea mideast africa; do
            echo "═══ $r ═══"
            node weekly-region-deep-feed.js --week="${{ steps.w.outputs.week }}" --region="$r" \
              && node weekly-region-deep-pdf.js --week="${{ steps.w.outputs.week }}" --region="$r" \
              || echo "::warning::[$r] 생성 실패 또는 소스 없음 — 생략"
          done

      # 권역 초안은 마크다운이 아니라 JSON 이라, 검증기가 문자열 잎(summary·issues[].lead)만
      # 모아 산문으로 보고 indices 를 근거 수치로 쓴다. 생성 스텝이 "데이터 있는 권역만"
      # 만들므로, 만들어진 파일에 대해서만 돈다.
      - name: 발행 전 검증 (기계 린트) — critical 이면 여기서 멈춘다
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish != 'false' }}
        run: |
          WEEK="${{ steps.w.outputs.week }}"
          FOUND=0; FAILED=""
          for f in content/weekly-region-deep/"$WEEK"-*.json; do
            [ -e "$f" ] || continue
            FOUND=$((FOUND+1))
            npm run weekly-report:verify -- --file="$f" || FAILED="$FAILED $(basename "$f")"
          done
          [ "$FOUND" -gt 0 ] || { echo "::warning::$WEEK 권역 초안이 없다 — 검증 건너뜀"; exit 0; }
          [ -z "$FAILED" ] || {
            echo "::error::검증 실패 —$FAILED · critical 을 고친 뒤 다시 실행할 것"
            exit 1
          }

      - name: 발행 (reports 버킷 + 카탈로그)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish != 'false' }}
        run: node weekly-region-publish.js --week="${{ steps.w.outputs.week }}" --commit

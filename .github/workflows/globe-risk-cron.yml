name: globe-risk-cron

# 기상 리스크 지구본 스케줄러 — Supabase Edge Function 트리거 (pg_cron 대체).
# risk-refresh(예보→asset_risk): 하루 3회. event-ingest(재해 피드→events): 2시간마다(태풍·지진 급변 대비).
# 독립 job — 한쪽 실패가 다른쪽을 막지 않음. HTTP ≥400이면 응답 본문 출력 + 빨간 X(원인 가시화, stale을 success로 숨기지 않음).
# 각 job은 자기 schedule에서만 실행(다른 schedule 런에선 회색 skip=정상). workflow_dispatch는 둘 다 실행.
# cron은 UTC. 분(minute)은 :07/:15 등 오프-아워 — GitHub는 정각(:00) 스케줄 드롭이 잦아 회피(과거 asset_risk stale 원인).
# SUPABASE_ANON_KEY = anon public 키 (verify_jwt 통과용). 이건 인가가 아니다 —— 공개 키라
# 누구나 이 값으로 함수를 부를 수 있었고, 함수 안에서는 service 키로 DB 를 쓴다.
# CRON_SECRET = 실제 문지기. 함수가 x-cron-secret 헤더를 이 값과 대조한다
#   (supabase/functions/_shared/require-cron-secret.ts). Supabase 쪽에도 같은 값을
#   넣어야 한다: supabase secrets set CRON_SECRET=<값>

on:
  schedule:
    - cron: '15 */2 * * *'   # event-ingest: 2시간마다 (:15 오프-아워)
    - cron: '7 16 * * *'     # risk-refresh: KST 01:07
    - cron: '7 23 * * *'     # risk-refresh: KST 08:07
    - cron: '7 7 * * *'      # risk-refresh: KST 16:07
  workflow_dispatch: {}        # 수동 실행 버튼 (둘 다 실행)

jobs:
  risk-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 16 * * *' || github.event.schedule == '7 23 * * *' || github.event.schedule == '7 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: risk-refresh
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            "https://hmgbvqczmyjixkqbruzp.supabase.co/functions/v1/risk-refresh" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP ${code}"; echo "--- response body ---"; cat /tmp/resp.txt; echo
          test "${code}" -lt 400

  event-ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: event-ingest
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            "https://hmgbvqczmyjixkqbruzp.supabase.co/functions/v1/event-ingest" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP ${code}"; echo "--- response body ---"; cat /tmp/resp.txt; echo
          test "${code}" -lt 400

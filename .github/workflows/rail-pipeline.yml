name: rail-pipeline

on:
  schedule:
    # UTC 00:20/06:20/12:20/18:20 = KST 09:20/15:20/21:20/03:20 (6h, KST 03:20 anchor)
    - cron: '20 0,6,12,18 * * *'
  workflow_dispatch: {}

concurrency:
  group: rail-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run rail pipeline
        run: node scripts/run-rail-pipeline.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

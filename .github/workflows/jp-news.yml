name: JP News (物流メディア)

# 일본판 뉴스 수집. 지금까지 사람이 PC에서 돌렸고, 그래서 원본 매체 기사가
# 29건밖에 쌓이지 않았다(나머지 271건은 예전 한국 기사 번역본).
#
# ■ 하루 두 번인 이유
# LOGISTICS TODAY·LNEWS·日本海事新聞은 평일 낮에 계속 올라온다.
# 하루 한 번이면 아침에 올라온 기사가 다음 날에야 사이트에 뜬다.
# 오전과 저녁에 한 번씩 받아 그날 안에 반영한다.
#
# ■ 왜 한꺼번에 다 받지 않는가
# 기사마다 원문을 열어 요약을 만든다(LLM 호출 + 매체 서버 부담).
# limit 로 회차당 건수를 묶고 나머지는 다음 회차로 넘긴다.
# 이미 저장한 URL 은 건너뛰므로 여러 번 돌아도 중복되지 않는다.

on:
  schedule:
    # 매일 09:00 / 19:00 JST. 처음엔 평일만(1-5) 돌렸는데, 일본 세 매체는
    # 평일 발행이어도 글로벌 매체(한국판 수집분)는 주말에도 올라온다.
    # 월요일 아침에 이틀치가 몰리면 회차 상한에 걸려 계속 밀린다.
    # 2026-08-15 — 뒤 회차만 10:00 → 10:30 UTC. DeepSeek peak 가 06:00–10:00 UTC 라
    # 정각 시작은 경계에 걸린다. 앞 회차 00:00 은 peak(01:00) 까지 60분, timeout 30분
    # 이라 그대로 둔다.
    - cron: '0 0 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 회차에 처리할 기사 수'
        type: string
        default: '25'

# 앞 회차가 아직 돌고 있으면 줄을 세운다. 같은 URL 을 동시에 upsert 하지 않는다.
concurrency:
  group: jp-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 수집기는 키가 없으면 예외로 멈추지만, 어느 키인지 먼저 밝혀 두면
      # 로그를 열지 않고도 원인을 안다. jp-collect 와 같은 이유다.
      - name: 자격증명 확인
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DEEPSEEK_API_KEY; do
            [ -n "$(eval echo \"\$$k\")" ] || missing="$missing $k"
          done
          [ -z "$missing" ] || { echo "::error::Secrets 누락 —$missing"; exit 1; }

      - name: Collect
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
          # 뉴스 요약은 판단이 아니라 압축이다. 하루 50건이라 모델값이 그대로 비용이 된다.
          # 리포트 생성·검수 쪽은 판단이 들어가므로 기본값(deepseek-v4-pro)을 유지한다.
          DEEPSEEK_MODEL:            deepseek-v4-flash
          LIMIT:                     ${{ inputs.limit || '25' }}
        run: npm run collect:news:jp -- --limit="$LIMIT"

      - name: Log to data_updates
        if: always()
        env:
          JOB_STATUS:                ${{ job.status }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
          const status = process.env.JOB_STATUS === 'success' ? 'ok' : 'error';
          sb.from('data_updates')
            .insert({ dataset: 'jp_news', status, notes: 'jp-news workflow' })
            .then(r => { console.log('data_updates logged:', r.error ? r.error.message : 'ok'); process.exit(0); })
            .catch(e => { console.error(e.message); process.exit(0); });
          "

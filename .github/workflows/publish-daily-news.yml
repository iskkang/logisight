name: Publish Daily Briefing Cards

# 역할: 일간 브리핑 카드(daily_card)를 maritime_news에 저장.
# 웹사이트 기사(article)는 생성하지 않음. 이메일 뉴스레터와 별개.
#
# daily_card: 홈페이지 히어로 카드 + 관련 링크 카드
# 웹사이트 기사 생성: daily-web-articles.yml
# 이메일 뉴스레터: daily-newsletter.yml

on:
  schedule:
    - cron: '0 21 * * *'  # 06:00 KST (21:00 UTC)
  workflow_dispatch:

jobs:
  publish-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Collect rail news
        run: npm run collect:rail:daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Collect ocean news
        run: npm run collect:ocean:daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Curate rail
        run: npm run curate:rail
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Curate ocean
        run: npm run curate:ocean
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Publish daily briefing cards (agent_type=daily_card)
        run: npm run publish:daily-cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

name: Fetch CIP RNE Terminals

on:
  schedule:
    - cron: "0 3 1 * *" # 매월 1일 12:00 KST (정적 참조 데이터)
  workflow_dispatch:

jobs:
  fetch-cip-terminals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Fetch and save CIP RNE terminals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-cip-terminals.mjs

name: KITA 참고운임 주간 수집

on:
  schedule:
    - cron: '0 18 * * 6'   # 매주 토요일 03:00 KST (UTC+9)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  fetch-kita-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 108개 노선 × 1.2s → 약 13분, 여유 있게 설정
    permissions:
      contents: write      # 캐시 커밋용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Fetch KITA sea fare (해상 참고운임 → Supabase)
        run: node generators/report/lib/kita-fare.js --force --push
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch KITA air fare (항공 참고운임 → Supabase)
        run: node generators/report/lib/kita-fare.js --air --force --push
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit cache (repo 캐시 갱신 — 월간 리포트가 이 파일을 읽음)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add outputs/cache/kita-fare-sea.json outputs/cache/kita-fare-air.json
          git commit -m "chore(kita): weekly fare cache $(date -u +%Y-%m-%d)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          echo "::error::KITA cache push failed after 3 attempts — 리포트가 낡은 캐시를 읽게 됨"; exit 1

      - name: Log to data_updates
        if: always()
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
          const status = process.env.JOB_STATUS === 'success' ? 'ok' : 'error';
          sb.from('data_updates')
            .insert({ dataset: 'kita_fare', status, notes: 'kita-fare-weekly (sea + air)' })
            .then(r => { console.log('logged:', r.error ? r.error.message : 'ok'); process.exit(0); })
            .catch(e => { console.error(e.message); process.exit(0); });
          "
        env:
          JOB_STATUS:                ${{ job.status }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

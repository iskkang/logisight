name: Monthly Freight Rates

on:
  schedule:
    - cron: '0 1 5 * *'   # 매월 5일 01:00 UTC (10:00 KST), 전월 화물운임 수집
  workflow_dispatch:        # 수동 트리거도 허용

jobs:
  fetch-freight-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: logisight-web/package-lock.json

      - name: Install deps
        working-directory: logisight-web
        run: npm ci

      - name: Fetch freight rates (KR POL)
        working-directory: logisight-web
        run: npx tsx scripts/fetch-freight-rates.ts
        env:
          DATA_GO_KR_API_KEY:        ${{ secrets.DATA_GO_KR_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

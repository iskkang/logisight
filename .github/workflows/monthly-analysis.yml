name: Monthly Analysis Sources

on:
  schedule:
    - cron: '0 19 2 * *'   # 매월 2일 04:00 KST — 월초 지수·기업 업데이트 발표 후
  workflow_dispatch:

jobs:
  collect-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Collect monthly analysis sources
        run: npm run collect:monthly
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generate sections (7-section pipeline, 2-pass self-review)
        run: npm run section:all
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Assemble report (force — CI auto-approval)
        run: node generators/report/assemble-monthly-report.js --force
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Log to data_updates
        if: always()
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
          const status = process.env.JOB_STATUS === 'success' ? 'ok' : 'error';
          sb.from('data_updates')
            .insert({ dataset: 'monthly_analysis', status, notes: 'monthly-analysis workflow' })
            .then(r => { console.log('data_updates logged:', r.error ? r.error.message : 'ok'); process.exit(0); })
            .catch(e => { console.error(e.message); process.exit(0); });
          "
        env:
          JOB_STATUS:                ${{ job.status }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

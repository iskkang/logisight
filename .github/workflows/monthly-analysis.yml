name: Monthly Analysis Sources

on:
  schedule:
    - cron: '0 19 2 * *'   # 매월 2일 04:00 KST — 월초 지수·기업 업데이트 발표 후
  workflow_dispatch:

jobs:
  collect-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Collect monthly analysis sources
        run: npm run collect:monthly
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Generate sections (7-section pipeline, 2-pass self-review)
        run: npm run section:all
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Assemble report (force — CI auto-approval)
        run: node generators/report/assemble-monthly-report.js --force
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 초안 QA + 에디터 브리프 (검수 창용 — 실패해도 초안 커밋은 진행)
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node generators/report/verify-report.js || echo "::warning::초안 QA critical 존재 — editor-brief.md 확인 후 5일 발행 전 수정 권고"

      - name: Commit draft (검수용 — 발행은 monthly-report-publish 수동 트리거)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/drafts/monthly-analysis-*.md content/monthly-report/**/*.md content/monthly-report/**/forecasts.json
          git commit -m "chore(monthly): draft $(date -u +%Y-%m)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          echo "::error::draft push failed after 3 attempts — 초안 유실 방지 위해 실패 처리"; exit 1

      - name: Log to data_updates
        if: always()
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
          const status = process.env.JOB_STATUS === 'success' ? 'ok' : 'error';
          sb.from('data_updates')
            .insert({ dataset: 'monthly_analysis', status, notes: 'monthly-analysis workflow' })
            .then(r => { console.log('data_updates logged:', r.error ? r.error.message : 'ok'); process.exit(0); })
            .catch(e => { console.error(e.message); process.exit(0); });
          "
        env:
          JOB_STATUS:                ${{ job.status }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

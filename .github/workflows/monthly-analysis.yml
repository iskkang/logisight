name: Monthly Analysis Sources

on:
  schedule:
    # 19:00 UTC 는 KST 로 +9h —— 날짜가 하루 넘어간다. 2일 19:00 UTC = 3일 04:00 KST.
    # 예전 주석은 "매월 2일 04:00 KST"라고 적고 있었는데, 그 값이면 cron 이 '0 19 1 * *'
    # 여야 한다. 발행일(5일) 과의 검수 창을 계산할 때 하루가 어긋난다.
    - cron: '0 19 2 * *'   # 매월 3일 04:00 KST — 월초 지수·기업 업데이트 발표 후
  workflow_dispatch:

jobs:
  collect-monthly:
    runs-on: ubuntu-latest
    # 2026-08-02 실행이 20분 18초에 잘려 8월 초안이 통째로 사라졌다.
    # 7섹션 × (생성 + 2패스 자체검수)가 20분에 안 들어간다. 첫 실행은 특히 그렇다.
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Collect monthly analysis sources
        run: npm run collect:monthly
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Generate sections (7-section pipeline, 2-pass self-review)
        run: npm run section:all
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}

      # 섹션이 끝나는 대로 남긴다.
      #
      # 2026-08-02 실행은 생성 도중 잘렸고, 커밋이 파이프라인 맨 끝에만 있어서
      # 러너와 함께 섹션 파일이 전부 사라졌다. 재실행해도 처음부터 다시 쓰고,
      # 다시 상한에 걸린다 — 계속 실패하는 구조였다.
      #
      # run-section.js 는 이미 approved 섹션을 건너뛴다. 여기서 커밋만 해두면
      # 다음 실행이 남은 섹션만 쓴다. 조립이 실패해도 진행분은 남는다.
      - name: 섹션 진행분 커밋 (조립 전 — 잘려도 다시 쓰지 않도록)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/monthly-report/**/*.md content/monthly-report/**/forecasts.json 2>/dev/null || true
          git diff --cached --quiet && { echo "진행분 없음"; exit 0; }
          git commit -m "chore(monthly): sections in progress $(date -u +%Y-%m)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          # 진행분 저장은 최선 노력이다. 여기서 실패해도 본 작업을 멈추지 않는다.
          echo "::warning::섹션 진행분 push 실패 — 다음 실행이 처음부터 쓰게 된다"

      # 아래 세 스텝은 if: always() 다 ★
      #
      # 2026-10-02 실행은 macro 섹션에서 예외가 나며 끝났고, 조건이 없던 조립·QA·
      # 초안 커밋이 전부 skipped 로 넘어갔다. 그 결과 초안이 아예 만들어지지 않아
      # 10/5 발행 워크플로가 "초안이 없다"로 죽었고, 10월호가 통째로 비었다.
      # 섹션 7개 중 6개가 멀쩡해도 초안 한 장 못 건지는 구조였다.
      #
      # 이제 run-section.js 가 실패한 섹션을 건너뛰고 끝까지 돌며 종료코드만 1로
      # 남기므로(섹션별 try/catch), 조립은 "있는 섹션만으로" 초안을 만든다.
      # 잡은 여전히 실패로 끝난다 —— 사람이 보고 재실행하면 성공분은 건너뛴다.
      - name: Assemble report (force — CI auto-approval)
        if: always()
        run: node generators/report/assemble-monthly-report.js --force
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 초안 QA + 에디터 브리프 (검수 창용 — 실패해도 초안 커밋은 진행)
        if: always()
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node generators/report/verify-report.js || echo "::warning::초안 QA critical 존재 — editor-brief.md 확인 후 5일 발행 전 수정 권고"

      - name: Commit draft (검수용 — 발행은 monthly-report-publish 수동 트리거)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/drafts/monthly-analysis-*.md content/monthly-report/**/*.md content/monthly-report/**/forecasts.json
          git commit -m "chore(monthly): draft $(date -u +%Y-%m)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          echo "::error::draft push failed after 3 attempts — 초안 유실 방지 위해 실패 처리"; exit 1

      - name: Log to data_updates
        if: always()
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
          const status = process.env.JOB_STATUS === 'success' ? 'ok' : 'error';
          sb.from('data_updates')
            .insert({ dataset: 'monthly_analysis', status, notes: 'monthly-analysis workflow' })
            .then(r => { console.log('data_updates logged:', r.error ? r.error.message : 'ok'); process.exit(0); })
            .catch(e => { console.error(e.message); process.exit(0); });
          "
        env:
          JOB_STATUS:                ${{ job.status }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

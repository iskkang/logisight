# .github/workflows/daily-newsletter.yml
# 사이트에 발행된 당일 기사(maritime_news)를 카드 이메일로 발송.
# 수집·큐레이션 없음 — 기사 생성은 daily-web-articles.yml(06:30 KST)이 담당.
# Required secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, INTERNAL_EMAIL
name: Daily Newsletter

on:
  schedule:
    - cron: '0 23 * * 0,2,4'   # 월·수·금 08:00 KST (전일 UTC 23:00 = 일·화·목)
  workflow_dispatch:

# 발신 주소 전환용. 리포지터리 변수 NEWSLETTER_EMAIL이 없으면 빈 값이 되고,
# generators/lib/site.js가 현행 주소를 기본값으로 쓴다(동작 불변).
# 발송 스텝뿐 아니라 생성 스텝도 이 값을 푸터 표기에 쓰므로 워크플로 전역으로 둔다.
env:
  NEWSLETTER_EMAIL: ${{ vars.NEWSLETTER_EMAIL }}

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate newsletter HTML from site articles
        run: npm run newsletter:from-site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Send newsletter
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          HTML_PATH="content/drafts/newsletter-${TODAY}.html"
          if [ -f "$HTML_PATH" ]; then
            echo "📄 HTML 발송: $HTML_PATH"
            node generators/email/send-newsletter.js --html="$HTML_PATH" --audience=subscribers
          else
            echo "⚠️ HTML 없음 — 발송 스킵"
          fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTERNAL_EMAIL: ${{ secrets.INTERNAL_EMAIL }}

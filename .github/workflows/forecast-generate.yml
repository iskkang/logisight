name: Forecast — Weekly Draft Generation

# 주간: 타깃 조립 → 채점 → 산문 → forecasts 적재.
# 발행: 확신 전망은 자동 발행(status='published'). 본문 미작성(needs_editor)만 draft로 검수 큐에 남김.
on:
  schedule:
    # 화요일 04:00 UTC (13:00 KST) — 화 02:00 market-collectors가 KCCI 월요일 발표분을 적재한 직후.
    # (이전 월 06:00은 KCCI 미발표 시점이라 stale 지수로 생성되는 문제가 있었음)
    - cron: '0 4 * * 2'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate forecast drafts
        run: npm run generate:forecasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

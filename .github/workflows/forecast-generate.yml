name: Forecast — Weekly Draft Generation

# 주간: 타깃 조립 → 채점 → 산문 → forecasts 에 status='draft' 적재.
# 발행은 프론트 /admin/forecasts 검수 큐에서만(자동 발행 없음).
on:
  schedule:
    - cron: '0 6 * * 1'   # 월요일 06:00 UTC (15:00 KST) — 주간 지수 갱신 이후
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate forecast drafts
        run: npm run generate:forecasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

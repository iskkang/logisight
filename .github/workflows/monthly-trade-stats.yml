name: Monthly Trade Statistics

on:
  schedule:
    - cron: '0 17 16 * *'  # 매월 16일 02:00 KST (관세청 15일 확정치 발표 다음 날)
  workflow_dispatch:
    inputs:
      period:
        description: '수집 기간 (YYYYMM, 비워두면 전월 자동)'
        required: false
        default: ''

jobs:
  fetch-trade-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Fetch customs trade statistics (country totals)
        run: |
          PERIOD_ARG=""
          if [ -n "${{ github.event.inputs.period }}" ]; then
            PERIOD_ARG="--period=${{ github.event.inputs.period }}"
          fi
          npx tsx collectors/trade_stats.ts $PERIOD_ARG
        env:
          DATA_GO_KR_API_KEY:        ${{ secrets.DATA_GO_KR_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # HS 품목별(item) + 품목별 국가별(item_country) + 대륙별 + 신성질별.
      # industries HS 트리맵·드릴다운이 소비. 국가 전수 순회라 길다(수 분).
      - name: Fetch customs HS categories (item / item_country / continent / newnature)
        run: |
          PERIOD_ARG=""
          if [ -n "${{ github.event.inputs.period }}" ]; then
            PERIOD_ARG="--period=${{ github.event.inputs.period }}"
          fi
          npx tsx collectors/trade_categories.ts $PERIOD_ARG
        env:
          DATA_GO_KR_API_KEY:        ${{ secrets.DATA_GO_KR_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # item 적재 직후 산업 브리핑 재생성. input_hash 비교로 데이터가 바뀐 달에만 실제 LLM 호출.
      - name: Regenerate industry brief (only if data changed)
        run: |
          curl -fsS -X POST "$SUPABASE_FUNCTION_URL/industry-brief-generate" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}

      - name: Log to data_updates
        if: always()
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { auth: { persistSession: false } });
          const status = process.env.JOB_STATUS === 'success' ? 'ok' : 'error';
          sb.from('data_updates')
            .insert({ dataset: 'trade_statistics', status, notes: 'monthly-trade-stats workflow' })
            .then(r => { console.log('data_updates logged:', r.error ? r.error.message : 'ok'); process.exit(0); })
            .catch(e => { console.error(e.message); process.exit(0); });
          "
        env:
          JOB_STATUS:               ${{ job.status }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

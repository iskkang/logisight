name: Weekly Market Report

on:
  schedule:
    - cron: '0 9 * * 0'   # 일요일 18:00 KST (UTC 09:00)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Collect market data
        run: npm run collect:all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Ingest CADI live tracing
        run: npm run collect:live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # TRACKING_API_TOKEN: ${{ secrets.TRACKING_API_TOKEN }}  # uncomment after token applied

      - name: Generate report draft
        run: npm run report:generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate CADI report
        run: npm run report:cadi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Convert to PDF
        run: node scripts/generate-pdf.js

      - name: Send newsletter
        run: node scripts/send-newsletter.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_TO: ${{ secrets.NEWSLETTER_EMAIL }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"⚠️ Logisight 주간 보고서 생성 실패. GitHub Actions 확인 필요."}'

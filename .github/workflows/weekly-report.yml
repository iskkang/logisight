name: Weekly Report Auto-Publish

# 완전 자동(승인 게이트 없음): 일요일 cron이 초안 생성 → 즉시 승인 → PDF → 발행 → 커밋.
# 검수 게이트가 필요하면 approve 단계를 빼고 .md만 커밋하도록 되돌리면 된다.
on:
  schedule:
    - cron: '0 5 * * 0'   # 일요일 14:00 KST (05:00 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 주간 본문 생성 = claude-sonnet-5 (2026-07 하이브리드)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Chrome 경로 확인
        id: chrome
        run: |
          BIN=$(which google-chrome || which google-chrome-stable || which chromium-browser || true)
          [ -z "$BIN" ] && { echo "::error::Chrome 미설치 — 러너에서 google-chrome 을 찾지 못함"; exit 1; }
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Chrome: $BIN"

      - name: 초안 생성 → 승인 → PDF → 발행
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          npm run weekly-report:generate
          WEEK=$(date -u +%G-W%V)
          echo "주차: $WEEK"
          npm run weekly-report:approve -- --week="$WEEK"

      - name: Commit md + PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/weekly-report/*.md content/published/weekly-report-*.pdf
          git commit -m "chore(weekly-report): auto-publish $(date -u +%G-W%V)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          echo "::error::weekly-report push failed after 3 attempts — 발행 유실 방지 위해 실패 처리"; exit 1
